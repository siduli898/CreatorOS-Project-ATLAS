services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatoros
      POSTGRES_USER: atlas_admin
      POSTGRES_PASSWORD: atlas_secure_password_2026
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../backend/migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    environment:
      PORT: 8080
      JWT_SECRET: atlas_production_secure_secret_key_2026
      DATABASE_URL: postgres://atlas_admin:atlas_secure_password_2026@postgres:5432/creatoros
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on: [postgres, redis]
volumes:
  pgdata:
